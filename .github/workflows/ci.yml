name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint all PHP files
        run: |
          find fluentsmtp-postal.php src -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  build-assets:
    name: Build admin assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run prod
      - name: Verify bundle was produced
        run: test -f assets/admin/js/postal-admin.js && test -f assets/admin/css/postal-admin.css
